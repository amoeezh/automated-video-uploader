name: Daily Instagram Reel

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate everything but stop before publishing to Instagram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core blender \
            xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libxi6 libxrender1 \
            libxkbcommon0 libsm6

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Determine dry run mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_DRY_RUN" = "false" ]; then
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          else
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          fi

      - name: Run pipeline (retries on transient failure)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          for attempt in 1 2 3; do
            echo "=== Pipeline attempt $attempt/3 ==="
            python src/pipeline.py && exit 0
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 60s..."
              sleep 60
            fi
          done
          echo "All 3 attempts failed."
          exit 1

      - name: Commit updated history
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || git commit -m "Update topic history [skip ci]"
          git pull --rebase origin main
          git push
